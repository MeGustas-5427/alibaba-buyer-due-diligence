<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户背调初筛报告</title>
  <style>
    :root {
      --green: #075733;
      --green-dark: #004326;
      --green-soft: #eef6f1;
      --blue: #2f6c9f;
      --blue-soft: #eaf1f8;
      --teal: #13796b;
      --teal-soft: #e5f3ef;
      --amber: #ad741d;
      --amber-soft: #fbf1df;
      --coral: #b55548;
      --coral-soft: #faebe7;
      --rose: #9b5362;
      --rose-soft: #f8edf0;
      --text: #222222;
      --muted: #656565;
      --line: #d9d9d9;
      --line-soft: #e8e8e8;
      --bg: #f2f2f0;
      --page-w: 768px;
      --page-h: 1024px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", "STSong", serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      padding: 24px;
    }

    .report {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .page {
      position: relative;
      width: var(--page-w);
      height: var(--page-h);
      padding: 42px 38px 34px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .page-number {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      text-align: center;
      color: #333;
      font-size: 14px;
      line-height: 1;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.18em;
      font-size: 40px;
      line-height: 1.15;
    }

    .header .subtitle {
      margin-top: 12px;
      color: #4a4a4a;
      font-size: 19px;
      letter-spacing: 0.08em;
    }

    .header.compact h1 {
      margin-top: 5px;
      font-size: 42px;
      letter-spacing: 0.16em;
    }

    .green-rule {
      position: relative;
      height: 11px;
      margin: 38px 0 28px;
    }

    .green-rule.tight {
      margin: 12px 0 32px;
    }

    .green-rule::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 3px;
      height: 4px;
      background: var(--green);
    }

    .green-rule::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 3px;
      width: 28px;
      height: 10px;
      transform: translateX(-50%);
      background: var(--green);
      clip-path: polygon(0 0, 100% 0, 72% 100%, 28% 100%);
    }

    .info-box {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 0;
      border: 1px solid #c9c9c9;
      border-radius: 5px;
      margin: 0 0 28px;
      padding: 13px 24px;
      color: #4c4c4c;
      font-size: 13px;
      line-height: 1.45;
    }

    .info-box .left {
      padding-right: 30px;
      border-right: 1px solid #d7d7d7;
    }

    .info-box .right {
      padding-left: 34px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 12px;
      margin: 6px 0;
    }

    .label {
      color: #222;
      font-weight: 600;
    }

    .section {
      margin-top: 0;
      margin-bottom: 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 0 26px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 20px;
      background: var(--green);
      flex: 0 0 auto;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 120px) minmax(0, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .summary-card {
      display: grid;
      grid-template-rows: auto 1fr;
      align-items: center;
      min-height: 108px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px 22px 17px;
      background: #fff;
    }

    .summary-card .card-title {
      min-height: 34px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .summary-card .card-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 55px;
      color: var(--green);
    }

    .summary-card .number {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .summary-card .risk-text {
      color: #222;
      font-size: 13px;
      line-height: 1.65;
      font-weight: 600;
    }

    .icon {
      width: 42px;
      height: 42px;
      color: var(--green);
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .icon.fill {
      fill: currentColor;
      stroke: none;
    }

    .icon.large {
      width: 52px;
      height: 52px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .matrix {
      margin-top: -4px;
      font-size: 13px;
      color: #4b4b4b;
    }

    .matrix th {
      height: 30px;
      background: var(--green-dark);
      color: #fff;
      border: 1px solid #759382;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .matrix td {
      height: 32px;
      border: 1px solid #d4d4d4;
      text-align: center;
    }

    .matrix col:nth-child(1) { width: 58px; }
    .matrix col:nth-child(2) { width: 108px; }
    .matrix col:nth-child(3) { width: 134px; }
    .matrix col:nth-child(4) { width: 130px; }
    .matrix col:nth-child(5) { width: 100px; }
    .matrix col:nth-child(6) { width: 114px; }
    .matrix col:nth-child(7) { width: 108px; }
    .matrix col:nth-child(8) { width: 142px; }

    .score-desc {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin-top: 18px;
    }

    .desc-card {
      min-height: 154px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 19px 13px 14px;
      background: #fff;
      text-align: center;
    }

    .desc-card h3 {
      margin: 0 0 18px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .desc-card .icon {
      margin: 0 auto 12px;
      width: 42px;
      height: 42px;
    }

    .desc-card p {
      margin: 0;
      color: #555;
      text-align: left;
      font-size: 12px;
      line-height: 1.55;
    }

    .page-1 .section.matrix-section {
      margin-bottom: 63px;
    }

    .page-1 .section.desc-section .section-title {
      margin-bottom: 24px;
    }

    .data-table {
      margin: 0 auto;
      color: #3a3a3a;
      font-size: 13px;
      border: 1px solid #d5d5d5;
    }

    .data-table td {
      border: 1px solid #dcdcdc;
      padding: 0 12px;
      height: 44px;
      vertical-align: middle;
      text-align: center;
    }

    .data-table .field {
      background: #fafafa;
      color: #222;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .client-table {
      width: 636px;
      margin-top: -10px;
      margin-bottom: 14px;
    }

    .client-table col:nth-child(1) { width: 104px; }
    .client-table col:nth-child(2) { width: 286px; }
    .client-table col:nth-child(3) { width: 104px; }
    .client-table col:nth-child(4) { width: 142px; }

    .judgement-table {
      width: 636px;
      margin-top: -7px;
      margin-bottom: 14px;
    }

    .judgement-table col:first-child { width: 166px; }

    .judgement-table td {
      height: 68px;
      padding: 10px 18px;
      text-align: left;
      line-height: 1.65;
    }

    .judgement-table .field {
      text-align: center;
      background: #fafafa;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      width: 636px;
      margin: -6px auto 16px;
    }

    .score-card {
      height: 116px;
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: center;
      padding-top: 15px;
      background: #fff;
    }

    .score-card.emphasis {
      background: #eff7f2;
      border-color: #d3dfd8;
    }

    .score-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .ring {
      --score: 0.74;
      position: relative;
      width: 66px;
      height: 66px;
      margin: 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--green) calc(var(--score) * 100%), #eeeeee 0);
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #fff;
    }

    .score-card.emphasis .ring::before {
      background: #eff7f2;
    }

    .ring span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Times New Roman", serif;
      color: #444;
      font-size: 20px;
      z-index: 1;
    }

    .source-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 636px;
      margin: -10px auto 11px;
      border: 1px solid #d5d5d5;
      border-radius: 5px;
      overflow: hidden;
      font-size: 13px;
      color: #555;
    }

    .source-box div {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #dcdcdc;
    }

    .source-box div:last-child {
      border-right: 0;
    }

    .source-box b {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 12px;
      border-radius: 50%;
      background: #111;
    }

    .advice-table {
      width: 636px;
      margin: -10px auto 0;
      color: #333;
      font-size: 12px;
    }

    .advice-table th {
      height: 32px;
      background: #fafafa;
      border: 1px solid #d9d9d9;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .advice-table td {
      height: 70px;
      border: 1px solid #d9d9d9;
      vertical-align: top;
      padding: 10px 16px 6px;
    }

    .advice-table ul {
      margin: 0;
      padding-left: 14px;
      line-height: 1.75;
    }

    .page-2 .section-title {
      margin-bottom: 22px;
    }

    .page-2 .section {
      margin-bottom: 15px;
    }

    .page-2 .section.score-section {
      margin-bottom: 14px;
    }

    .page-2 .section.source-section {
      margin-bottom: 16px;
    }

    /* Fixed pages reserve room for their footer instead of clipping content. */
    .summary-card {
      padding-left: 17px;
      padding-right: 17px;
    }

    .summary-card .card-content {
      gap: 12px;
    }

    .risk-card .card-content {
      gap: 8px;
      justify-content: flex-start;
    }

    .risk-card .icon.large {
      width: 44px;
      height: 44px;
    }

    .risk-card .risk-text {
      min-width: 62px;
      font-size: 12px;
      line-height: 1.45;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .matrix {
      width: 100%;
      table-layout: fixed;
      font-family: "Microsoft YaHei", "SimSun", sans-serif;
      font-size: 12px;
    }

    .matrix col:nth-child(1) { width: 7%; }
    .matrix col:nth-child(2) { width: 16%; }
    .matrix col:nth-child(3) { width: 14%; }
    .matrix col:nth-child(4) { width: 16%; }
    .matrix col:nth-child(5) { width: 11%; }
    .matrix col:nth-child(6) { width: 13%; }
    .matrix col:nth-child(7) { width: 12%; }
    .matrix col:nth-child(8) { width: 11%; }

    .matrix th {
      height: auto;
      padding: 6px 4px;
      line-height: 1.3;
    }

    .matrix td {
      height: auto;
      padding: 7px 5px;
      line-height: 1.4;
      vertical-align: middle;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .page-1 .section.matrix-section {
      margin-bottom: 8px;
    }

    .page-1 .section.desc-section .section-title {
      margin-bottom: 8px;
    }

    .page-1 .score-desc {
      gap: 12px;
      margin-top: 0;
    }

    .page-1 .desc-card {
      min-height: 132px;
      padding: 10px 8px 8px;
    }

    .page-1 .desc-card h3 {
      margin-bottom: 6px;
      font-size: 14px;
    }

    .page-1 .desc-card .icon {
      width: 34px;
      height: 34px;
      margin-bottom: 6px;
    }

    .page-1 .desc-card p {
      font-size: 11px;
      line-height: 1.4;
    }

    .page-2 {
      padding-top: 22px;
      padding-bottom: 20px;
    }

    .page-2 .header.compact h1 {
      margin-top: 0;
    }

    .page-2 .owner-line {
      margin-top: 12px;
      color: var(--green);
      font-family: "Microsoft YaHei", "SimSun", sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-align: center;
    }

    .page-2 .owner-line b {
      color: #222;
      font-weight: 600;
      letter-spacing: 0;
    }

    .page-2 .green-rule.tight {
      margin: 11px 0 24px;
    }

    .page-2 .section,
    .page-2 .section.score-section,
    .page-2 .section.source-section {
      margin-bottom: 14px;
    }

    .page-2 .section-title {
      margin-bottom: 15px;
      font-size: 18px;
    }

    .page-2 .section-title::before {
      height: 18px;
    }

    .page-2 .client-table {
      margin-top: -6px;
      margin-bottom: 8px;
    }

    .page-2 .client-table td {
      height: auto;
      padding: 7px 10px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .page-2 .judgement-table {
      margin-top: -5px;
      margin-bottom: 8px;
    }

    .page-2 .judgement-table td {
      height: 50px;
      padding: 6px 14px;
    }

    .page-2 .judgement-table td:not(.field) {
      font-size: 11.5px;
      line-height: 1.45;
    }

    .page-2 .score-grid {
      margin: -4px auto 8px;
    }

    .page-2 .score-card {
      height: 94px;
      padding-top: 9px;
    }

    .page-2 .score-card h3 {
      margin-bottom: 7px;
      font-size: 13px;
    }

    .page-2 .ring {
      width: 54px;
      height: 54px;
    }

    .page-2 .ring::before {
      inset: 7px;
    }

    .page-2 .ring span {
      font-size: 18px;
    }

    .page-2 .source-box {
      margin: -8px auto 8px;
    }

    .page-2 .source-box div {
      height: 32px;
      padding: 0 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-2 .advice-table {
      margin: -8px auto 0;
      font-size: 11px;
    }

    .page-2 .advice-table th {
      height: 25px;
      font-size: 12px;
    }

    .page-2 .advice-table td {
      height: auto;
      min-height: 60px;
      padding: 6px 12px 4px;
    }

    .page-2 .advice-table ul {
      line-height: 1.45;
    }

    .page-2 .advice-table li {
      overflow-wrap: anywhere;
    }

    .page-2 .page-number {
      bottom: 16px;
    }

    /* Metric visual system: print-safe, inline SVG colors and score states. */
    .icon {
      display: block;
      fill: currentColor;
      stroke: none;
      stroke-width: 0;
    }

    .summary-card,
    .desc-card,
    .score-card {
      --tone: var(--green);
      --tone-soft: var(--green-soft);
      --tone-line: #cfe0d7;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      border-color: var(--tone-line);
    }

    .summary-card::before,
    .desc-card::before,
    .score-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--tone);
    }

    .summary-card .card-title,
    .summary-card .card-content,
    .summary-card .number,
    .desc-card h3,
    .score-card h3 {
      color: var(--tone);
    }

    .icon-badge {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 50%;
      background: var(--tone-soft);
      color: var(--tone);
      flex: 0 0 auto;
    }

    .icon-badge .icon {
      width: 27px;
      height: 27px;
      margin: 0;
    }

    .summary-customers {
      --tone: var(--blue);
      --tone-soft: var(--blue-soft);
      --tone-line: #d3e1ee;
    }

    .summary-confidence,
    .metric-match {
      --tone: var(--teal);
      --tone-soft: var(--teal-soft);
      --tone-line: #cce5de;
    }

    .summary-followup,
    .metric-potential {
      --tone: var(--blue);
      --tone-soft: var(--blue-soft);
      --tone-line: #d3e1ee;
    }

    .summary-risk {
      --tone: var(--coral);
      --tone-soft: var(--coral-soft);
      --tone-line: #efd4ce;
    }

    .metric-risk,
    .metric-profit {
      --tone: var(--amber);
      --tone-soft: var(--amber-soft);
      --tone-line: #efdfbd;
    }

    .metric-relationship {
      --tone: var(--rose);
      --tone-soft: var(--rose-soft);
      --tone-line: #ead5db;
    }

    .risk-safe {
      --tone: var(--teal);
      --tone-soft: var(--teal-soft);
      --tone-line: #cce5de;
    }

    .risk-watch {
      --tone: var(--amber);
      --tone-soft: var(--amber-soft);
      --tone-line: #efdfbd;
    }

    .risk-alert {
      --tone: var(--coral);
      --tone-soft: var(--coral-soft);
      --tone-line: #efd4ce;
    }

    .desc-card,
    .score-card {
      position: relative;
      overflow: hidden;
      border-color: var(--tone-line);
    }

    .page-1 .desc-card .icon-badge {
      width: 34px;
      height: 34px;
      margin: 0 auto 6px;
    }

    .page-1 .desc-card .icon-badge .icon {
      width: 22px;
      height: 22px;
      margin: 0;
    }

    .score-card.emphasis {
      --tone: var(--green);
      --tone-soft: var(--green-soft);
      --tone-line: #cfe0d7;
      background: var(--green-soft);
      border-color: var(--tone-line);
    }

    .ring {
      background: conic-gradient(var(--tone) calc(var(--score) * 100%), var(--tone-soft) 0);
      box-shadow: 0 0 0 3px var(--tone-soft);
    }

    .ring::before,
    .score-card.emphasis .ring::before {
      background: var(--tone-soft);
    }

    .ring span {
      color: var(--tone);
      font-weight: 600;
    }

    @media screen and (min-width: 1680px) {
      .report {
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
      }
    }

    @media screen and (max-width: 860px) {
      body {
        padding: 12px;
      }
      .page {
        transform-origin: top center;
        width: min(var(--page-w), calc(100vw - 24px));
        height: auto;
        min-height: calc((100vw - 24px) * 1.3333);
      }
    }

    @page {
      size: 768px 1024px;
      margin: 0;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .report {
        display: block;
        margin: 0;
      }
      .page {
        width: 768px;
        height: 1024px;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }
      .page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>
<body>
